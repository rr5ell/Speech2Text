name: speech_to_text_sherpa
description: "Offline Speech to Text using Sherpa-ONNX SenseVoice - supports Chinese, English, Korean, Japanese"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: ^1.13.0
  record: ^6.1.2
  path_provider: ^2.1.0
  permission_handler: ^10.4.5
  archive: ^3.6.0
  path: ^1.9.0
  dio: ^5.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
